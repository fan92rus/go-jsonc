version: "2"
run:
  timeout: 2m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -SA1029
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 100
  max-same-issues: 5
output:
  formats:
    colored-line-number:
      path: stdout
